# Mode local : le « cluster » est le conteneur lui-même (4 cœurs).
spark.master                                   local[4]
spark.driver.memory                            2g
spark.sql.shuffle.partitions                   8
spark.sql.session.timeZone                     Europe/Paris
# Catalogue en mémoire : on désigne les tables par leur chemin (delta.`s3a://...`).
spark.sql.catalogImplementation                in-memory

# Delta Lake : format de table transactionnel sur des fichiers Parquet.
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog
# Autorise VACUUM RETAIN 0 HOURS (démo uniquement ; à ne jamais faire en production).
spark.databricks.delta.retentionDurationCheck.enabled false

# Accès S3 à MinIO (protocole s3a://).
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.access.key                 admin
spark.hadoop.fs.s3a.secret.key                 admin12345
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider   org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.ui.showConsoleProgress                   false
